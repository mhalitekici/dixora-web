[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dixora-api"
version = "0.1.0"
description = "Dixora multi-tenant hospitality operations API"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "greenlet>=3.1,<4",
  "httpx>=0.27,<1",
  "minio>=7.2.15,<8",
  "openpyxl>=3.1.5,<4",
  "Pillow>=12.3,<13",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<7",
  "SQLAlchemy>=2.0.36,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
dixora-seed = "app.seed:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:passlib.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
