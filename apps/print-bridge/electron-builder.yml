appId: com.dixora.print-bridge
productName: Dixora Print Bridge
electronVersion: 44.2.0
icon: assets/icon.png
directories:
  output: ../../../release/dixora-print-bridge-desktop
files:
  - "**/*"
  - "!**/*.test.*"
  - "!**/*.d.ts"
  - "!**/*.map"
asar: true
win:
  artifactName: Dixora-Print-Bridge-Setup.exe
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
mac:
  artifactName: Dixora-Print-Bridge.dmg
  category: public.app-category.business
  darkModeSupport: true
  icon: assets/icon.icns
  minimumSystemVersion: "11.0"
  target:
    - target: dmg
      arch:
        - universal
dmg:
  title: Dixora Print Bridge
