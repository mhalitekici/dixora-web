# Dixora - production stack for a single Hetzner host.
#
# Differences from docker-compose.yml, which stays the local development stack:
#   * only the reverse proxy publishes ports; everything else is reachable
#     solely on the internal network
#   * the API runs the production image (no pytest/mypy/ruff) behind the proxy,
#     with forwarded headers trusted from that network only
#   * every image is pinned, including the ones Compose would otherwise float
#   * the mock print bridge is absent: it prints nothing, and an internet-facing
#     stack should not carry a service that exists to fake hardware
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
name: ${COMPOSE_PROJECT_NAME:-dixora}

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    command:
      ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - dixora

  redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - dixora

  minio:
    # Pinned: `latest` has shipped breaking console and API changes, and an
    # unattended restart is the worst moment to discover one.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - dixora

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${DIXORA_S3_BUCKET:-dixora-media}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc anonymous set none "local/$${S3_BUCKET}"
    networks:
      - dixora

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: production
    image: ${DIXORA_API_IMAGE:-dixora-api:production}
    restart: unless-stopped
    env_file:
      - ${DIXORA_ENV_FILE:-.env.production}
    environment:
      # Guardrails that hold no matter what the env file says. Production schema
      # comes from Alembic alone, and the development seed would create demo
      # businesses with known passwords on a public host.
      DIXORA_ENVIRONMENT: production
      DIXORA_AUTO_CREATE_SCHEMA: "false"
      DIXORA_DEV_SEED_ENABLED: "false"
      DIXORA_SQL_ECHO: "false"
    # Migrations run to completion before the first request is served, so a
    # failed migration leaves the container dead rather than serving traffic
    # against a schema it does not match. --proxy-headers makes the real client
    # address visible for rate limiting and audit, trusted only from the
    # internal network the proxy sits on.
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2} --proxy-headers --forwarded-allow-ips=${DIXORA_FORWARDED_ALLOW_IPS:-172.28.0.0/16}",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - dixora

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        # Baked into the browser bundle at build time, so these must be the
        # public URLs rather than internal service names.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?set NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_ENABLE_PIN_LOGIN: ${NEXT_PUBLIC_ENABLE_PIN_LOGIN:-true}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL}
    image: ${DIXORA_WEB_IMAGE:-dixora-web:production}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      BACKEND_API_URL: ${BACKEND_API_URL:-http://api:8000/api/v1}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_REFRESH_COOKIE_MAX_AGE_SECONDS: ${AUTH_REFRESH_COOKIE_MAX_AGE_SECONDS:-2592000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NEXT_PUBLIC_ENABLE_PIN_LOGIN: ${NEXT_PUBLIC_ENABLE_PIN_LOGIN:-true}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    init: true
    networks:
      - dixora

  proxy:
    image: nginx:1.29.5-alpine
    restart: unless-stopped
    # The only service the internet can reach.
    ports:
      - "80:80"
      - "443:443"
    environment:
      DIXORA_DOMAIN: ${DIXORA_DOMAIN:-dixoratech.com}
      DIXORA_NETWORK_SUBNET: ${DIXORA_NETWORK_SUBNET:-172.28.0.0/16}
    volumes:
      - ./infrastructure/nginx/templates:/etc/nginx/templates:ro
      - ./infrastructure/nginx/snippets:/etc/nginx/snippets:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - dixora

  certbot:
    image: certbot/certbot:v5.0.0
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Renewal is a no-op until a certificate is within 30 days of expiry, so
    # this loop is cheap and needs no scheduler on the host.
    entrypoint:
      - /bin/sh
      - -c
      - "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks:
      - dixora

networks:
  dixora:
    name: ${COMPOSE_PROJECT_NAME:-dixora}-network
    # Fixed so the API can trust forwarded headers from this network and from
    # nothing else. Change this and DIXORA_FORWARDED_ALLOW_IPS together.
    ipam:
      config:
        - subnet: ${DIXORA_NETWORK_SUBNET:-172.28.0.0/16}

volumes:
  postgres_data:
  redis_data:
  minio_data:
  letsencrypt:
  certbot_www:
