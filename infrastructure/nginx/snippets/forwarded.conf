# What every proxied location tells the upstream about the caller.
#
# X-Forwarded-For is SET, never appended: whatever the caller wrote in it is
# discarded and replaced with the address nginx actually accepted the
# connection from. Login throttling and the audit trail are keyed on that
# address, so a caller able to add a hop of their own choosing could dodge
# both. Everything behind this proxy - the Next.js server and uvicorn - reads
# the last hop, which is therefore always the one written here.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

proxy_connect_timeout 5s;
proxy_redirect off;
