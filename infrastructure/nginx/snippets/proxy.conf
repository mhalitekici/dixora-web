# Ordinary HTTP proxying. WebSocket locations do NOT include this file: it
# clears the Connection header, and setting that header twice in one location
# sends it twice.
include /etc/nginx/snippets/forwarded.conf;

# Keepalive to the upstream needs HTTP/1.1 with the hop-by-hop Connection
# header cleared.
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_send_timeout 60s;
proxy_read_timeout 60s;

# Let the application decide what may be cached; it already marks the operator
# workspaces no-store.
proxy_buffering on;
