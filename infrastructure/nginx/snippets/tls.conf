# TLS settings shared by every HTTPS server block.
#
# TLS 1.2 is kept alongside 1.3: the tablets and older Android handsets used as
# waiter terminals in venues do not all speak 1.3, and locking them out is a
# support call in the middle of service, not a security win.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_cache shared:DixoraTLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Serving the certificate chain the client needs to verify staples.
ssl_stapling on;
ssl_stapling_verify on;
resolver 127.0.0.11 valid=60s;
resolver_timeout 5s;

# Nothing identifies the server beyond the product name.
server_tokens off;
